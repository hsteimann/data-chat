    important: "Already aggregated at the daily grain — one row per ASIN per campaign per day. Do NOT wrap metrics in SUM() for time-series queries (SELECT date, metric ORDER BY date) — use columns directly. Use SUM() only when collapsing across a non-date dimension (e.g., summing all campaigns into a client total). Always recalculate ratio KPIs (acos, roas, ctr, cpc) from summed components, never average them."
    extra_context: "Each ASIN is a specific product. This view shows how each product performs in advertising."
    use_for: "identifying best/worst-selling products, finding products with high ad spend but low sales, product-level profitability analysis, comparing product performance across campaigns"
    typical_questions:
      - "Which products have the worst ACoS?"
      - "Show me the top 10 products by sales"
      - "Which ASINs are getting clicks but no purchases?"
      - "What's the ad performance for ASIN B0xxxxx?"
