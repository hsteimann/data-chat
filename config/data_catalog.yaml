      - name: asin
        type: STRING
        description: "Amazon Standard Identification Number — product identifier"
        definition: "10-stelliger alphanumerischer Amazon-Produktidentifier. JOIN-Key zwischen v_ads_asin_daily und rf_products. Unique per Variante (Child ASIN)."
      - name: sku
        type: STRING
        description: "Seller's Stock Keeping Unit"
        definition: "Händler-interner Produktcode, vom Seller selbst vergeben. Kann sich ändern. Für Produktanalysen asin bevorzugen."
      - name: campaign_name
        type: STRING
        description: "Campaign display name as set in Amazon Ads console"
        definition: "Frei wählbarer Name, kann jederzeit geändert werden. v_ads_asin_daily hat keine campaign_id — campaign_name ist hier der JOIN-Key mit v_ads_campaign_daily."
