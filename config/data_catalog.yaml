# Data Catalog — single source of truth for queryable views and tables.
# Used by Data Chat and Custom Views builder to understand the schema.
# Column definitions should match the actual SQL views in sql/views/*.sql.

views:
  v_ads_summary_daily:
    description: "Client-level daily totals (aggregated across all campaigns)"
    grain: "One row per client per day — the big-picture numbers."
    important: "Already aggregated at the daily grain — one row per client per day. Do NOT wrap metrics in SUM() for time-series queries (SELECT date, metric ORDER BY date) — use columns directly. Use SUM() only when collapsing across a non-date dimension (e.g., summing all campaigns into a client total). Always recalculate ratio KPIs (acos, roas, ctr, cpc) from summed components, never average them."
    use_for: "overall spend trends, total sales over time, daily/weekly/monthly performance summaries, comparing time periods, checking if spend or sales are up or down"
    typical_questions:
      - "How much did we spend last month?"
      - "What's our overall ACoS trend?"
      - "Compare this week vs last week."
    columns:
      - name: date
        type: DATE
        description: "Business date — the day these metrics apply to"
        definition: "DATE in YYYY-MM-DD (Marktplatz-Timezone). Für Datumsfilter: WHERE date BETWEEN '2026-01-01' AND '2026-01-31'. Daten können 48–72h nach dem Datum noch nachjustiert werden."
      - name: active_campaigns
        type: INT64
        description: "Number of distinct campaigns with activity on this day"
        definition: "COUNT(DISTINCT campaign_id) aus v_ads_campaign_daily. Zeigt wie viele Kampagnen an diesem Tag Impressions, Klicks oder Spend hatten."
      - name: impressions
        type: INT64
        description: "Number of times the ad was displayed"
        definition: "Gezählt wenn eine Anzeige auf der Amazon-Suchergebnisseite oder Produktdetailseite gerendert wird. Addierbar via SUM(impressions) über Kampagnen/Tage. Wird für CTR benötigt."
      - name: clicks
        type: INT64
        description: "Number of times a shopper clicked the ad"
        definition: "Ein Klick wird gezählt wenn ein Shopper auf die Anzeige klickt. Addierbar. Wird für CTR, CPC, CVR verwendet — niemals CTR/CPC/CVR direkt summieren."
      - name: cost
        type: FLOAT64
        description: "Total ad spend in account currency"
        definition: "Gesamte CPC-Kosten für validierte Klicks. Addierbar via SUM(cost). Währung ist EUR für DE-Marktplatz, USD für US. Wird für ACoS, ROAS, CPC berechnet."
      - name: purchases
        type: INT64
        description: "Attributed purchases within 1-day click window"
        definition: "Bestellabschlüsse die einem Ad-Klick innerhalb von 24h zugeordnet werden. 1-Day-Attribution — NICHT vergleichbar mit SB-Purchases (14-Day). Addierbar via SUM."
      - name: sales
        type: FLOAT64
        description: "Attributed sales revenue within 1-day click window, in account currency"
        definition: "Umsatz aus Käufen die einem Ad-Klick innerhalb von 24h zugeordnet werden. Addierbar. SP-Attribution (1d) ≠ SB-Attribution (14d) — niemals beide in einer UNION aggregieren."
      - name: units_sold
        type: INT64
        description: "Units sold attributed to ad clicks within 1-day window"
        definition: "Anzahl einzelner Produkteinheiten die einem Ad-Klick innerhalb von 24h zugeordnet werden. Addierbar."
      - name: acos
        type: FLOAT64
        description: "Advertising Cost of Sales = cost/sales × 100 [%]"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(cost, sales1d) * 100, 2). Beim Aggregieren IMMER neu berechnen: ROUND(SAFE_DIVIDE(SUM(cost), SUM(sales)) * 100, 2). Niemals SUM(acos)."
      - name: roas
        type: FLOAT64
        description: "Return on Ad Spend = sales/cost [ratio]"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(sales1d, cost), 2). Beim Aggregieren neu berechnen: ROUND(SAFE_DIVIDE(SUM(sales), SUM(cost)), 2). Niemals SUM(roas). v_ads_summary_daily hat korrekt aggregierten ROAS."
      - name: ctr
        type: FLOAT64
        description: "Click-through rate = clicks/impressions × 100 [%]"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(clicks, impressions) * 100, 2). Beim Aggregieren: ROUND(SAFE_DIVIDE(SUM(clicks), SUM(impressions)) * 100, 2). Niemals direkt summieren oder mitteln."
      - name: cpc
        type: FLOAT64
        description: "Cost per click = cost/clicks [currency]"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(cost, clicks), 2). Beim Aggregieren: ROUND(SAFE_DIVIDE(SUM(cost), SUM(clicks)), 2). Niemals direkt summieren."
      - name: cvr
        type: FLOAT64
        description: "Conversion rate = purchases/clicks × 100 [%]"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(purchases1d, clicks) * 100, 2). Beim Aggregieren: ROUND(SAFE_DIVIDE(SUM(purchases), SUM(clicks)) * 100, 2). Niemals direkt summieren."
      - name: client_id
        type: STRING
        description: "ADP client identifier"
        definition: "Nakoas interner Client-Key (z.B. 'client_07'). Wird beim Datenladen eingefügt. Immer vorhanden — kann als Filter genutzt werden."

  v_ads_campaign_daily:
    description: "Campaign-level daily performance metrics"
    grain: "One row per campaign per day."
    important: "Already aggregated at the daily grain — one row per campaign per day. Do NOT wrap metrics in SUM() for time-series queries (SELECT date, metric ORDER BY date) — use columns directly. Use SUM() only when collapsing across a non-date dimension (e.g., summing all campaigns into a client total). Always recalculate ratio KPIs (acos, roas, ctr, cpc) from summed components, never average them."
    use_for: "identifying top/bottom campaigns, checking campaign budgets and status, analyzing spend distribution across campaigns, finding paused or underperforming campaigns"
    typical_questions:
      - "Which campaigns have the highest ACoS?"
      - "Show me paused campaigns that were still spending"
      - "Which campaign has the best ROAS?"
      - "How is budget distributed across campaigns?"
    columns:
      - name: date
        type: DATE
        description: "The reporting date"
        definition: "DATE in YYYY-MM-DD (Marktplatz-Timezone). Für Datumsfilter: WHERE date BETWEEN '2026-01-01' AND '2026-01-31'. Daten können 48–72h nach dem Datum noch nachjustiert werden."
      - name: campaign_id
        type: STRING
        description: "Unique campaign identifier"
        definition: "Numerischer Amazon-Campaign-ID als STRING. Stabiler JOIN-Key — wird niemals wiederverwendet. Nur innerhalb eines Advertising-Profils eindeutig."
      - name: campaign_name
        type: STRING
        description: "Human-readable campaign name"
        definition: "Frei wählbarer Name, kann jederzeit geändert werden. Für JOINs campaign_id bevorzugen — v_ads_asin_daily hat keine campaign_id, daher dort campaign_name als JOIN-Key."
      - name: campaign_status
        type: STRING
        description: "Campaign lifecycle state: ENABLED or PAUSED"
        definition: "ENABLED = aktiv und bereit Anzeigen auszuspielen. PAUSED = manuell pausiert. Budget- oder Datumsende-Stopps werden separat gesteuert."
      - name: budget
        type: FLOAT64
        description: "Daily budget cap for the campaign in account currency"
        definition: "Maximalbetrag pro Tag. Amazon kann bis zu 10% overdelivern und gleicht das über andere Tage aus. Der Wert ist aktueller Stand — nicht historisch."
      - name: currency
        type: STRING
        description: "ISO 4217 currency code (e.g. EUR, USD)"
        definition: "Gilt für alle Geldwerte in dieser Zeile (cost, sales, budget). DE-Marktplatz = EUR, US = USD."
      - name: impressions
        type: INT64
        description: "Number of ad impressions"
        definition: "Gezählt wenn eine Anzeige auf der Amazon-Suchergebnisseite oder Produktdetailseite gerendert wird. Addierbar via SUM(impressions) über Kampagnen/Tage. Wird für CTR benötigt."
      - name: clicks
        type: INT64
        description: "Number of ad clicks"
        definition: "Ein Klick wird gezählt wenn ein Shopper auf die Anzeige klickt. Addierbar. Wird für CTR, CPC, CVR verwendet — niemals CTR/CPC/CVR direkt summieren."
      - name: cost
        type: FLOAT64
        description: "Total ad spend"
        definition: "Gesamte CPC-Kosten für validierte Klicks. Addierbar via SUM(cost). Währung ist EUR für DE-Marktplatz, USD für US. Wird für ACoS, ROAS, CPC berechnet."
      - name: purchases
        type: INT64
        description: "Number of attributed purchases"
        definition: "Bestellabschlüsse die einem Ad-Klick innerhalb von 24h zugeordnet werden. 1-Day-Attribution — NICHT vergleichbar mit SB-Purchases (14-Day). Addierbar via SUM."
      - name: sales
        type: FLOAT64
        description: "Total attributed sales revenue"
        definition: "Umsatz aus Käufen die einem Ad-Klick innerhalb von 24h zugeordnet werden. Addierbar. SP-Attribution (1d) ≠ SB-Attribution (14d) — niemals beide in einer UNION aggregieren."
      - name: units_sold
        type: INT64
        description: "Number of units sold"
        definition: "Anzahl einzelner Produkteinheiten die einem Ad-Klick innerhalb von 24h zugeordnet werden. Addierbar."
      - name: acos
        type: FLOAT64
        description: "Advertising Cost of Sales (cost/sales * 100), as percentage"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(cost, sales1d) * 100, 2). Beim Aggregieren IMMER neu berechnen: ROUND(SAFE_DIVIDE(SUM(cost), SUM(sales)) * 100, 2). Niemals SUM(acos)."
      - name: roas
        type: FLOAT64
        description: "Return on Ad Spend (sales/cost)"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(sales1d, cost), 2). Beim Aggregieren neu berechnen: ROUND(SAFE_DIVIDE(SUM(sales), SUM(cost)), 2). Niemals SUM(roas)."
      - name: ctr
        type: FLOAT64
        description: "Click-through rate (clicks/impressions * 100), as percentage"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(clicks, impressions) * 100, 2). Beim Aggregieren: ROUND(SAFE_DIVIDE(SUM(clicks), SUM(impressions)) * 100, 2). Niemals direkt summieren oder mitteln."
      - name: cpc
        type: FLOAT64
        description: "Cost per click (cost/clicks)"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(cost, clicks), 2). Beim Aggregieren: ROUND(SAFE_DIVIDE(SUM(cost), SUM(clicks)), 2). Niemals direkt summieren."
      - name: cvr
        type: FLOAT64
        description: "Conversion rate (purchases/clicks * 100), as percentage"
        definition: "Vorberechnet via ROUND(SAFE_DIVIDE(purchases1d, clicks) * 100, 2). Beim Aggregieren: ROUND(SAFE_DIVIDE(SUM(purchases), SUM(clicks)) * 100, 2). Niemals direkt summieren."
      - name: client_id
        type: STRING
        description: "ADP client identifier"
        definition: "Nakoas interner Client-Key (z.B. 'client_07'). Wird beim Datenladen eingefügt. Immer vorhanden — kann als Filter genutzt werden."

