[project]
name = "data-chat"
version = "0.1.0"
description = "Natural-language questions to checkable SQL, with a field-level data catalog. An excerpt of the Nakoa Brain, made runnable."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
bigquery = ["google-cloud-bigquery>=3.25", "db-dtypes>=1.3"]

[project.scripts]
data-chat = "data_chat.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
