    columns:
      - name: date
        type: DATE
        description: Day.
      - name: channel
        type: VARCHAR
        description: google_search or meta.
      - name: clicks
        type: INTEGER
        description: Ad clicks.
      - name: cost
        type: BIGINT
        description: Spend in euro cents.

  marketing_budget_monthly:
    description: The planned advertising budget per month and channel.
    grain: One row per month and channel.
    use_for: Planned budget, budget versus actual spend, budget utilisation per channel.
    typical_questions:
      - Did we stay within the Meta budget in August?
      - What was the total ad budget for July?
    important: >-
      A plan, not spend. Actual spend comes from ads_all_channels_monthly (join on month and
      channel) or ads_all_channels_daily. The September budget is for the full month, while the
      data ends 2026-09-27.
    columns:
      - name: month
        type: DATE
        description: First day of the month.
      - name: channel
        type: VARCHAR
        description: Ad channel, same values as ads_all_channels_daily.channel.
      - name: planned_budget_eur
        type: DOUBLE
        description: Planned spend for the month in EUR.

  # ── Web analytics ───────────────────────────────────────────────────────

  web_sessions_daily:
    description: Web-shop sessions per day and channel group, from web analytics.
    grain: One row per day and channel_group.
    use_for: Traffic, engaged sessions, new and returning users, engagement rate, session duration and pages per session per channel group.
    typical_questions:
      - How many sessions came from organic search in August?
      - What was the daily average number of sessions last month?
      - Which channel group has the best engagement rate?
    important: >-
      One row per day AND channel group — a daily average over all channels is SUM(sessions) /
      number of days, not AVG(sessions). engagement_rate, avg_session_duration_sec and
      pages_per_session are per-row ratios: weight them by sessions over several rows. Purchases are
      not in this table — they are in the web conversion tables (conversion rate = purchases there /
      sessions here, same date and channel_group).
    columns:
      - name: date
        type: DATE
        description: Day.
      - name: channel_group
        type: VARCHAR
        description: paid_search, paid_shopping, paid_social, organic_search, direct, email or referral.
      - name: sessions
        type: INTEGER
        description: Sessions.
      - name: engaged_sessions
        type: INTEGER
        description: Sessions that lasted at least 10 seconds or viewed two pages.
      - name: new_users
        type: INTEGER
        description: First-time visitors.
      - name: returning_users
        type: INTEGER
        description: Visitors who had been on the site before.
      - name: engagement_rate
        type: DOUBLE
        description: engaged_sessions / sessions of the row.
        definition: Per-row ratio. Over several rows use SUM(engaged_sessions) / SUM(sessions).
      - name: avg_session_duration_sec
        type: DOUBLE
        description: Average session duration of the row in seconds.
        definition: Weight by sessions over several rows.
      - name: pages_per_session
        type: DOUBLE
        description: Average pages viewed per session of the row.
      - name: bounce_rate
        type: DOUBLE
        description: Share of sessions of the row that were not engaged (1 - engagement_rate).
        definition: Per-row ratio. Over several rows use 1 - SUM(engaged_sessions) / SUM(sessions).
      - name: sessions_with_site_search
        type: INTEGER
        description: Sessions that used the site search.

  web_conversions_last_click_daily:
    description: Web-shop purchases per day and channel group, attributed to the LAST click before the purchase.
    grain: One row per day and channel_group.
    use_for: Purchases and purchase revenue per channel group under last-click attribution — the default answer to which channel brought the sales; conversion rate per channel together with web_sessions_daily.
    typical_questions:
      - Which channel brought the most purchases?
      - What was the conversion rate per channel group?
      - How much revenue came through email?
    important: >-
      Counts completed web-shop orders. All three attribution tables have the same total per day
      and differ only in how they split it across channel groups. Use THIS one unless the question
      names first click or data-driven / multi-touch attribution. Revenue here is gross and excludes
      shipping; net = purchase_revenue_gross / 1.19.
    columns:
      - name: date
        type: DATE
        description: Day.
      - name: channel_group
        type: VARCHAR
        description: Channel group, same values as web_sessions_daily.
      - name: purchases
        type: INTEGER
        description: Purchases attributed to the channel group by last click.
      - name: purchase_revenue_gross
        type: DOUBLE
        description: Revenue of those purchases in EUR including VAT, excluding shipping.

  web_conversions_first_click_daily:
    description: Web-shop purchases per day and channel group, attributed to the FIRST click of the customer journey.
    grain: One row per day and channel_group.
    use_for: Which channels start the journeys that end in a purchase (first-click attribution).
    typical_questions:
      - Which channel starts most customer journeys?
      - How many purchases does paid social initiate (first click)?
    important: >-
      Same total as the last-click table, split by the first touch. Only use it when a question
      asks about first click, first touch or where journeys start.
    columns:
      - name: date
        type: DATE
        description: Day.
      - name: channel_group
        type: VARCHAR
        description: Channel group.
      - name: purchases
        type: INTEGER
        description: Purchases attributed to the channel group by first click.
      - name: purchase_revenue_gross
        type: DOUBLE
        description: Revenue of those purchases in EUR including VAT, excluding shipping.

  web_conversions_data_driven_daily:
    description: Web-shop purchases per day and channel group, attributed data-driven across the touchpoints of a journey.
    grain: One row per day and channel_group.
    use_for: Channel contribution under data-driven (multi-touch) attribution.
    typical_questions:
      - How do purchases split across channels with data-driven attribution?
    important: >-
      Same total as the last-click table, shared fractionally between touchpoints, so purchases is
      fractional. Only use it when a question asks about data-driven or multi-touch attribution.
    columns:
      - name: date
        type: DATE
        description: Day.
      - name: channel_group
        type: VARCHAR
        description: Channel group.
      - name: purchases
        type: DOUBLE
        description: Fractional purchases credited to the channel group.
      - name: purchase_revenue_gross
        type: DOUBLE
        description: Revenue credited to the channel group in EUR including VAT, excluding shipping.

  web_funnel_daily:
    description: The web-shop purchase funnel per day and device, from web analytics.
    grain: One row per day and device.
    use_for: Funnel steps from session to purchase, drop-off per step, cart abandonment, mobile versus desktop.
    typical_questions:
      - What share of sessions added something to the cart?
      - How does the mobile conversion rate compare to desktop?
      - What is our cart abandonment rate?
    important: >-
      Each step counts sessions that reached it. Step rates are ratios of sums over the period, e.g.
      SUM(add_to_carts) / SUM(sessions); cart_to_purchase_rate is per row. Cart abandonment rate = 1
      - SUM(purchases) / SUM(add_to_carts). purchases equals the web-shop's completed orders.
    columns:
      - name: date
        type: DATE
        description: Day.
      - name: device
        type: VARCHAR
        description: mobile, desktop or tablet.
      - name: sessions
        type: INTEGER
        description: Sessions.
      - name: product_views
        type: INTEGER
        description: Sessions with at least one product page view.
      - name: add_to_carts
        type: INTEGER
        description: Sessions with at least one add-to-cart.
      - name: checkouts
        type: INTEGER
        description: Sessions that started the checkout.
      - name: purchases
        type: INTEGER
        description: Sessions with a completed purchase.
      - name: cart_to_purchase_rate
        type: DOUBLE
        description: purchases / add_to_carts of the row.
        definition: Per-row ratio — recompute from sums over several rows.

  web_landing_pages_daily:
    description: Sessions per day and landing page, from web analytics.
    grain: One row per day and landing_page.
    use_for: Which entry pages bring traffic, engagement and purchases.
    typical_questions:
      - Which landing page had the most sessions?
      - Which landing page converts best?
    important: >-
      Covers only the main landing pages, so its sums are below the site totals in
      web_sessions_daily, and its purchase_revenue_gross is an analytics estimate that does not
      reconcile with the shop. engagement_rate and avg_engagement_time_sec are per-row values.
    columns:
      - name: date
        type: DATE
        description: Day.
      - name: landing_page
        type: VARCHAR
        description: Path of the first page of the session.
      - name: sessions
        type: INTEGER
        description: Sessions that started on the page.
      - name: engaged_sessions
        type: INTEGER
        description: Engaged sessions that started on the page.
      - name: purchases
        type: INTEGER
        description: Sessions starting there that ended in a purchase.
      - name: engagement_rate
        type: DOUBLE
        description: engaged_sessions / sessions of the row.
      - name: avg_engagement_time_sec
        type: DOUBLE
        description: Average engaged time of the row's sessions in seconds.
      - name: purchase_revenue_gross
        type: DOUBLE
        description: Revenue of those purchases in EUR including VAT, as analytics estimates it.

  web_site_search_weekly:
    description: Searches in the shop's own site search per week and search term.
    grain: One row per week (keyed by its Monday) and search_term.
    use_for: What visitors search for on the site, and which searches lead to exits.
    typical_questions:
      - What were the most searched terms on our site?
    columns:
      - name: week_start
        type: DATE
        description: Monday of the week.
      - name: search_term
        type: VARCHAR
        description: Search term entered.
      - name: searches
        type: INTEGER
        description: Number of searches.
      - name: search_exits
        type: INTEGER
        description: Searches after which the visitor left the site.

  email_sends_daily:
    description: Email sends per day and email campaign, from the email tool.
    grain: One row per day and email_campaign with sends.
    use_for: Email volume, opens, clicks, open and click rates.
    typical_questions:
      - How many newsletters did we send in August?
      - What was the email open rate?
    important: >-
      Purchases from email are in the web conversion tables (channel_group = 'email'), not here.
      Rates are ratios of sums: open rate = SUM(opens) / SUM(sends), click rate = SUM(clicks) /
      SUM(sends).
    columns:
      - name: date
        type: DATE
        description: Day.
      - name: email_campaign
        type: VARCHAR
        description: newsletter_weekly, abandoned_cart, summer_sale or new_arrivals.
      - name: sends
        type: INTEGER
        description: Emails delivered.
      - name: opens
        type: INTEGER
        description: Emails opened.
      - name: clicks
        type: INTEGER
        description: Emails with a click.

join_relationships:
  - {view_a: shop_orders, view_b: shop_order_items, keys: [order_id]}
  - {view_a: shop_orders, view_b: shop_returns, keys: [order_id]}
  - {view_a: shop_orders, view_b: customers, keys: [customer_id]}
  - {view_a: shop_order_items, view_b: shop_returns, keys: [order_id, sku]}
  - {view_a: shop_order_items, view_b: products, keys: [sku]}
  - {view_a: shop_returns, view_b: products, keys: [sku]}
  - {view_a: shop_product_sales_daily, view_b: products, keys: [sku]}
  - {view_a: shop_inventory_daily, view_b: products, keys: [sku]}
  - {view_a: marketplace_amazon_sales_daily, view_b: products, keys: [sku]}
  - {view_a: marketplace_otto_sales_daily, view_b: products, keys: [sku]}
  - {view_a: ads_google_shopping_product_daily, view_b: products, keys: [sku]}
  - {view_a: ads_google_search_campaign_daily, view_b: campaigns, keys: [campaign_id]}
  - {view_a: ads_google_shopping_product_daily, view_b: campaigns, keys: [campaign_id]}
  - {view_a: ads_meta_campaign_daily, view_b: campaigns, keys: [campaign_id]}
  - {view_a: ads_microsoft_campaign_daily, view_b: campaigns, keys: [campaign_id]}
  - {view_a: ads_amazon_sp_campaign_daily, view_b: campaigns, keys: [campaign_id]}
  - {view_a: ads_all_channels_monthly, view_b: marketing_budget_monthly, keys: [month, channel]}
  - {view_a: web_sessions_daily, view_b: web_conversions_last_click_daily, keys: [date, channel_group]}

join_notes:
  - Per-day tables join on date; aggregate both sides to the same grain before joining, or a one-to-many join multiplies the sums.
  - shop_returns joins shop_order_items on BOTH order_id and sku; on order_id alone every return multiplies across all lines of its order.
  - ads_all_channels_daily joins campaigns only through a per-channel table — it has no campaign_id.

query_examples:
  - name: A ratio over a period is a ratio of sums
    sql: |
      SELECT channel,
             ROUND(SUM(cost_eur) / NULLIF(SUM(clicks), 0), 2) AS cpc_eur
      FROM {ads_all_channels_daily}
      WHERE date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY channel
      ORDER BY cpc_eur DESC

  - name: Google micros to euros, with campaign names
    sql: |
      SELECT c.campaign_name,
             ROUND(SUM(g.cost_micros) / 1e6, 2) AS spend_eur,
             ROUND(SUM(g.conversion_value) / NULLIF(SUM(g.cost_micros) / 1e6, 0), 2) AS roas
      FROM {ads_google_search_campaign_daily} g
      JOIN {campaigns} c ON c.campaign_id = g.campaign_id
      WHERE g.date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY c.campaign_name
      ORDER BY spend_eur DESC

  - name: Return rate of an order cohort
    sql: |
      SELECT p.category,
             SUM(COALESCE(r.units_returned, 0)) / SUM(i.units) AS return_rate
      FROM {shop_order_items} i
      JOIN {shop_orders} o ON o.order_id = i.order_id AND o.order_status = 'completed'
      LEFT JOIN {shop_returns} r ON r.order_id = i.order_id AND r.sku = i.sku
      JOIN {products} p ON p.sku = i.sku
      WHERE i.order_date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY p.category

  - name: Conversion rate per channel group (last click)
    sql: |
      WITH s AS (SELECT channel_group, SUM(sessions) AS sessions FROM {web_sessions_daily}
                 WHERE date BETWEEN '2026-06-01' AND '2026-06-30' GROUP BY channel_group),
           p AS (SELECT channel_group, SUM(purchases) AS purchases FROM {web_conversions_last_click_daily}
                 WHERE date BETWEEN '2026-06-01' AND '2026-06-30' GROUP BY channel_group)
      SELECT s.channel_group, p.purchases / s.sessions AS conversion_rate
      FROM s JOIN p USING (channel_group)
      ORDER BY conversion_rate DESC

  - name: Budget against actual spend
    sql: |
      SELECT b.channel, b.planned_budget_eur, a.cost_eur,
             a.cost_eur / b.planned_budget_eur AS utilisation
      FROM {marketing_budget_monthly} b
      LEFT JOIN {ads_all_channels_monthly} a ON a.month = b.month AND a.channel = b.channel
      WHERE b.month = '2026-06-01'

  - name: Weighted average of a per-row share
    sql: |
      SELECT c.campaign_name,
             SUM(g.search_impression_share * g.impressions) / NULLIF(SUM(g.impressions), 0) AS impression_share
      FROM {ads_google_search_campaign_daily} g
      JOIN {campaigns} c ON c.campaign_id = g.campaign_id
      WHERE g.date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY c.campaign_name

  - name: Gross margin per brand from net revenue and purchase cost
    sql: |
      SELECT p.brand,
             SUM(s.revenue_net) AS revenue_net,
             SUM(s.revenue_net) - SUM(s.units_ordered * p.cost_price_net) AS gross_margin
      FROM {shop_product_sales_daily} s
      JOIN {products} p ON p.sku = s.sku
      WHERE s.date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY p.brand
      ORDER BY gross_margin DESC

  - name: Amazon ACoS over a period, one attribution window
    sql: |
      SELECT campaign_name,
             SUM(cost) / NULLIF(SUM(attributed_sales_14d), 0) AS acos_14d
      FROM {ads_amazon_sp_campaign_daily}
      WHERE date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY campaign_name

  - name: Week over week with whole weeks only
    sql: |
      SELECT week_start, revenue_net,
             revenue_net / LAG(revenue_net) OVER (ORDER BY week_start) - 1 AS change
      FROM {shop_sales_weekly}
      WHERE week_start BETWEEN '2026-06-01' AND '2026-06-29'
      ORDER BY week_start

  - name: Daily average over a table with one row per day and group
    sql: |
      SELECT SUM(sessions) / COUNT(DISTINCT date) AS sessions_per_day
      FROM {web_sessions_daily}
      WHERE date BETWEEN '2026-06-01' AND '2026-06-30'

  - name: Marketplaces and web shop in one gross figure
    sql: |
      SELECT 'web_shop' AS sales_channel, SUM(revenue_gross) AS revenue_gross
      FROM {shop_sales_daily} WHERE date BETWEEN '2026-06-01' AND '2026-06-30'
      UNION ALL
      SELECT marketplace, SUM(revenue_gross)
      FROM {marketplace_sales_daily} WHERE date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY marketplace

  - name: Meta reach is not summable — report impressions and the daily average reach
    sql: |
      SELECT campaign_name,
             SUM(impressions) AS impressions,
             AVG(reach) AS avg_daily_reach
      FROM {ads_meta_campaign_daily}
      WHERE date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY campaign_name

  - name: Funnel step rates as ratios of sums, per device
    sql: |
      SELECT device,
             SUM(product_views) / SUM(sessions) AS view_rate,
             SUM(add_to_carts) / SUM(sessions) AS add_to_cart_rate,
             SUM(purchases) / SUM(sessions) AS conversion_rate,
             1 - SUM(purchases) / NULLIF(SUM(add_to_carts), 0) AS cart_abandonment_rate
      FROM {web_funnel_daily}
      WHERE date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY device

ai_warnings:
  - Money units differ by table — Google tables are in micros (cost_micros), the deprecated ads_all_channels_daily_v1 in cents, everything else in EUR.
  - Gross includes 19 % VAT, net excludes it. Otto reports net, Amazon and the web shop report gross; "revenue" without a qualifier means net web-shop revenue (shop_sales_daily.revenue_net).
  - Web shop, Amazon and Otto are separate sales channels with separate tables; "our revenue" or "shop revenue" means the web shop unless a question names a marketplace or asks for all channels.
  - Platform-attributed conversions in the ad tables are not shop orders and overlap between channels; web-shop purchases per channel come from the web conversion tables.
  - Columns holding a precomputed per-row ratio (ctr, cpc, average_cpc, acos_14d, roas_14d, frequency, engagement_rate, avg_order_value_net, impression shares) must not be averaged or summed over rows; recompute them from the summed numerator and denominator.
  - Tables marked DEPRECATED must not be used to answer questions.
  - Weekly tables run Monday to Sunday and are keyed by week_start; monthly tables are keyed by the first day of the month; September 2026 is partial.
